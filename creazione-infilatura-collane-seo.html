            "text": "Il tempo di riparazione per una collana di perle dipende dalla complessità del lavoro. Per una infilatura semplice senza nodi servono 2-3 giorni lavorativi. Per una infilatura con nodi professionali tra le perle (tecnica raccomandata per collane di valore) servono 5-7 giorni lavorativi, poiché ogni nodo viene realizzato a mano con precisione. Se necessario cambio chiusura, aggiungiamo 1-2 giorni. Lavoriamo anche su prenotazione per riparazioni urgenti."

          }

          }
