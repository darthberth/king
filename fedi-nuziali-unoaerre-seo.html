        {
          "@type": "Question",
          "name": "Cosa significa il marchio UNOAERRE 1AR?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Il marchio 1AR significa \"uno-a-erre\" ed è il primo marchio orafo registrato nella provincia di Arezzo, assegnato all'azienda il 2 aprile 1935. Questo codice identificativo è diventato il nome stesso dell'azienda: UNOAERRE. Il marchio è presente all'interno di ogni fede insieme all'indicazione dei millesimi (750 per l'oro 18 carati) e garantisce l'autenticità e la qualità del prodotto."
          }
        },
        {
          "@type": "Question",
          "name": "Perché le fedi UNOAERRE sono senza saldature?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le fedi UNOAERRE nascono da un unico blocco d'oro, modellato senza mai essere tagliato o saldato. Questa tecnica, perfezionata in quasi 100 anni di esperienza, ha un significato simbolico profondo: così come la fede non ha interruzioni, anche l'unione degli sposi deve essere continua e senza \"giunture\". È il simbolo di integrità e purezza che caratterizza il matrimonio."
          }
        },
        {
          "@type": "Question",
          "name": "Qual è la differenza tra fedi Classiche e Comode?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le fedi Classiche hanno un profilo tradizionale bombato con interno piatto. Le fedi Comode (Comfort Fit) invece hanno l'interno arrotondato, che le rende più confortevoli da indossare quotidianamente. La scelta dipende dalle preferenze personali: le Comode sono ideali per chi non ha mai portato anelli o chi lavora molto con le mani."
          }
        },

          "@type": "Question",
